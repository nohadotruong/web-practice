<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="shortcut icon"
      href="https://images.squarespace-cdn.com/content/v1/6014f6d17afdae55ced84a12/1612070516488-6EEOZLPWLFY3703BAA3O/favicon.ico?format=100w"
      type="image/x-icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/form.css" />

    <title>Sign Up</title>
  </head>
  <body>
    <section
      class="form__container d-flex align-items-center justify-content-center"
    >
      <form
        action=""
        class="form__section container d-flex flex-column gap-3"
        onsubmit="handleSubmit(event)"
      >
        <div>
          <a
            href="../index.html"
            class="d-flex align-items-center gap-1"
            ><i class="bi bi-arrow-left"></i>Return home</a
          >
          <h3
            class="d-flex justify-content-center align-items-center gap-2"
          >
            <i
              class="bi bi-person-fill"
              style="font-size: 25px"
            ></i>
            Create an Account
          </h3>
          <hr />
        </div>

        <div class="d-flex flex-column">
          <div class="input__section">
            <input
              id="email"
              type="text"
              placeholder="Email"
              class="w-100"
            />
            <i class="bi bi-envelope-fill"></i>
          </div>
          <p class="m-0 p-0 error" id="email-error"></p>
        </div>

        <div class="d-flex flex-column">
          <div class="input__section">
            <input
              id="username"
              type="text"
              placeholder="Username"
              class="w-100"
            />
            <i class="bi bi-person-fill"></i>
          </div>
          <p class="m-0 p-0 error" id="username-error"></p>
        </div>

        <div class="d-flex flex-column">
          <div class="input__section">
            <input
              id="password"
              type="password"
              placeholder="Password"
              class="w-100"
            />
            <i class="fas fa-key"></i>
          </div>
          <p class="m-0 p-0 error" id="password-error"></p>
        </div>

        <div class="d-flex flex-column">
          <div class="input__section">
            <input
              id="cpassword"
              type="password"
              placeholder="Confirm Password"
              class="w-100"
            />
            <i class="bi bi-arrow-repeat"></i>
          </div>
          <p class="m-0 p-0 error" id="cpassword-error"></p>
        </div>

        <div
          class="button__section d-flex flex-column justify-content-center gap-2"
        >
          <div class="d-flex flex-column">
            <div class="checkbox__section">
              <input type="checkbox" id="checkbox" />
              <p class="p-0 m-0">
                I have read and agree with
                <a href="">terms</a>
              </p>
            </div>
            <p
              class="m-0 p-0 error"
              id="checkbox-error"
              style="text-align: left"
            ></p>
          </div>
          <button
            type="submit"
            class="btn btn-success w-100"
            style="text-transform: uppercase"
          >
            Sign up
          </button>

          <hr />

          <p class="text-center p-0 m-0">
            Already a member?
            <a href="signIn.html">Login here</a>
          </p>
        </div>
      </form>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/signUp.js"></script>
  </body>
</html>
